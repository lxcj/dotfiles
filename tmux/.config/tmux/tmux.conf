set -ga terminal-overrides ",*:RGB"

set -g mouse on
set -g set-clipboard on

set -g extended-keys on
set -g extended-keys-format csi-u

# Start window and pane number at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Change prefix to Ctrl + a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Allow config reloading using prefix + r
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "#[bg=yellow]Config reloaded."

# Allow pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Allow window switching with Shift + arrow keys
bind -n S-Left  previous-window
bind -n S-Right next-window

# Status line style
set -g status-position top
set -g status-style bg=default,fg=white,bright
set -g status-left-length 30
set -g status-justify centre
set -g window-status-current-style fg=magenta
set -g window-status-separator "#[fg=black] | "

# Label that turns red while prefix is used
set -g status-right-length 20
set -g status-right '#{?client_prefix,#[fg=red]#[bold],#[fg=blue,bright]}tmux'

# Set status line message style
set -g message-style "bg=yellow,fg=black,fill=yellow"

# Set pane border style
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=black

